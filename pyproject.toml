[project]
dependencies = [
  "aiosqlite>=0.22.1",
  "asyncmy>=0.2.11",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "itsdangerous>=2.2.0",
  "langchain-openai>=1.8.1",
  "langgraph>=1.2.22",
  "langgraph-checkpoint-sqlite>=3.1.3",
  "loguru>=0.7.3",
  "mcp>=1.26,<2",
  "pydantic>=2.12.5",
  "pymysql>=1.1.2",
  "pytest>=8.4.1",
  "python-dotenv>=1.1.1",
  "rich>=14.2.0",
  "sqlacodegen>=4.0.3",
  "sqlalchemy>=2.0.49",
  "tzdata>=2026.6",
  "uvicorn>=0.34.0",
]
description = "Education support Agent, MCP tools and operations workspace"
name = "edu-support"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
